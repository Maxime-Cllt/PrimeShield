  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-darwin, build-windows, build-linux-x86-64,
#             build-linux-aarch64
    ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Rename artifacts with OS/Arch
        shell: bash
        run: |
          mkdir -p renamed_artifacts
          for artifact in artifacts/*; do
            # Extraire OS et arch du nom de l'artefact
            filename=$(basename "$artifact")
            os_arch=$(echo "$filename" | cut -d'-' -f1,2)
          
            # Déterminer l'extension
            if [[ "$os_arch" == windows* ]]; then
              ext=".exe"
            else
              ext=""
            fi
          
            # Renommer et copier
            cp "$artifact/PrimeShield$ext" "renamed_artifacts/PrimeShield-$os_arch$ext"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: renamed_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}