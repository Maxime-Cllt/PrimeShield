name: "Build & Release Workflow"

on:
  push:
    tags:
      - 'v*'


jobs:

  build-darwin:
    name: Build for macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [ x86_64-apple-darwin, aarch64-apple-darwin ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: rustup target add ${{ matrix.arch }}


      - name: Build for macOS ${{ matrix.arch }}
        run: cargo build --release --target ${{matrix.arch}}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-app-${{ matrix.arch }}
          path: target/${{matrix.arch}}/release/PrimeShield

  build-windows:
    name: Build for Windows (x86 and ARM)
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ x86_64-pc-windows-msvc, aarch64-pc-windows-msvc ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: rustup target add ${{ matrix.arch }}

      - name: Build for Windows ${{ matrix.arch }}
        run: cargo build --release --target ${{matrix.arch}}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-${{ matrix.arch }}
          path: target/${{ matrix.arch }}/release/PrimeShield.exe


  build-linux-x86-64:
    name: Build for Linux x86
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ x86_64-unknown-linux-musl ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Rust build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: rustup target add ${{ matrix.arch }}

      - name: Build for Linux ${{ matrix.arch }}
        run: cargo build --release --target ${{ matrix.arch }}

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-${{ matrix.arch }}
          path: target/${{ matrix.arch }}/release/PrimeShield


