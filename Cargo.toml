[package]
name = "PrimeShield"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Maxime-Cllt/PrimeShield.git"
authors = ["Maxime-Cllt", "Sudo Rahman"]

[dependencies]
rand = "0.9.0-beta.1"

[dev-dependencies]


[profile.dev]
incremental = true
codegen-units = 20
opt-level = 0
panic = "unwind"
debug = true
lto = false
overflow-checks = true

[profile.release]
incremental = false
codegen-units = 1
opt-level = 2
panic = "abort"
strip = true
debug = false
lto = true
overflow-checks = false