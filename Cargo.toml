[package]
name = "PrimeShield"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Maxime-Cllt/PrimeShield.git"
authors = ["Maxime-Cllt", "Sudo Rahman"]
description = "Une implémentation de l'algorithme RSA en Rust, simulant un échange d'informations sécurisé entre deux utilisateurs."

[dependencies]
rand = "0"
rayon = "1"
iced = "0"
tokio =  { version = "1", features = ["full"] }
num-traits = "0"
crypto-bigint = "0.5.5"
num-bigint = "0"

[dev-dependencies]
num-format = "0"

[profile.dev]
incremental = true
codegen-units = 20
opt-level = 0
panic = "unwind"
debug = true
lto = false
overflow-checks = true

[profile.release]
incremental = false
codegen-units = 1
opt-level = 2
panic = "abort"
strip = true
debug = false
lto = true
overflow-checks = false